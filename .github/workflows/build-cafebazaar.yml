name: "🟢 Build BodyMod - CafeBazaar Edition"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_bazaar:
    name: "Compile & Sign CafeBazaar APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Skeleton & Custom Icon (CafeBazaar)
        run: |
          cp -r lib /tmp/bm_lib
          cp pubspec.yaml /tmp/bm_pubspec.yaml
          if [ -f icon.png ]; then cp icon.png /tmp/bm_icon.png; fi

          rm -rf android ios web build www platforms plugins app.html config.xml package.json
          flutter create --org ir.matinmohammadi --project-name bodymod --platforms=android .

          rm -rf lib
          cp -r /tmp/bm_lib lib
          cp /tmp/bm_pubspec.yaml pubspec.yaml
          mkdir -p assets
          if [ -f /tmp/bm_icon.png ]; then
            cp /tmp/bm_icon.png icon.png
            cp /tmp/bm_icon.png assets/icon.png
          fi

          pip install Pillow
          python3 - << 'ICON_EOF'
          import os, shutil
          from PIL import Image
          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              res_dir = "android/app/src/main/res"
              shutil.rmtree(os.path.join(res_dir, "mipmap-anydpi-v26"), ignore_errors=True)
              for folder, px in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}.items():
                  p = os.path.join(res_dir, folder)
                  os.makedirs(p, exist_ok=True)
                  img.resize((px, px), Image.Resampling.LANCZOS).save(os.path.join(p, "ic_launcher.png"), format="PNG")
          ICON_EOF

          sed -i 's/android:label="bodymod"/android:label="BodyMod"/g' android/app/src/main/AndroidManifest.xml
          python3 - << 'PY_NATIVE'
import os
manifest_path = "android/app/src/main/AndroidManifest.xml"
m = open(manifest_path, "r", encoding="utf-8").read()
for perm in [
    '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>',
    '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>'
]:
    if perm not in m:
        m = m.replace("<application", perm + "\n    <application", 1)
receiver_xml = '<receiver android:name=".BmStreakReceiver" android:exported="false" />'
if "BmStreakReceiver" not in m:
    m = m.replace("</application>", "        " + receiver_xml + "\n    </application>", 1)
open(manifest_path, "w", encoding="utf-8").write(m)

kt_dir = "android/app/src/main/kotlin/ir/matinmohammadi/bodymod"
os.makedirs(kt_dir, exist_ok=True)

main_kt = """package ir.matinmohammadi.bodymod

import android.app.AlarmManager
import android.app.PendingIntent
import android.content.Context
import android.content.Intent
import android.os.Build
import android.provider.Settings
import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel

class MainActivity: FlutterActivity() {
    private val CHANNEL = "ir.matinmohammadi.bodymod/native"

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
            when (call.method) {
                "getAndroidId" -> {
                    try {
                        val aid = Settings.Secure.getString(contentResolver, Settings.Secure.ANDROID_ID) ?: ""
                        result.success(aid)
                    } catch (e: Exception) {
                        result.success("")
                    }
                }
                "scheduleStreakReminder" -> {
                    try {
                        val delayMillis = (call.argument<Number>("delayMillis")?.toLong()) ?: 43200000L
                        val title = call.argument<String>("title") ?: "بادی‌مود 💙"
                        val body = call.argument<String>("body") ?: ""
                        val intent = Intent(this, BmStreakReceiver::class.java).apply {
                            putExtra("title", title)
                            putExtra("body", body)
                        }
                        val flags = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                            PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE
                        } else {
                            PendingIntent.FLAG_UPDATE_CURRENT
                        }
                        val pi = PendingIntent.getBroadcast(this, 8842, intent, flags)
                        val am = getSystemService(Context.ALARM_SERVICE) as AlarmManager
                        am.set(AlarmManager.RTC_WAKEUP, System.currentTimeMillis() + delayMillis, pi)
                        result.success(true)
                    } catch (e: Exception) {
                        result.success(false)
                    }
                }
                else -> result.notImplemented()
            }
        }
    }
}
"""
open(os.path.join(kt_dir, "MainActivity.kt"), "w", encoding="utf-8").write(main_kt)

recv_kt = """package ir.matinmohammadi.bodymod

import android.app.Notification
import android.app.NotificationChannel
import android.app.NotificationManager
import android.content.BroadcastReceiver
import android.content.Context
import android.content.Intent
import android.os.Build

class BmStreakReceiver : BroadcastReceiver() {
    override fun onReceive(context: Context, intent: Intent) {
        val title = intent.getStringExtra("title") ?: "بادی‌مود 💙🔥"
        val body = intent.getStringExtra("body") ?: "امروز تعامل نکردی رفیق!"
        val nm = context.getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
        val channelId = "bm_streak_blue_heart"
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            val ch = NotificationChannel(channelId, "یادآور استریک بادی‌مود", NotificationManager.IMPORTANCE_DEFAULT)
            nm.createNotificationChannel(ch)
        }
        val builder = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
            Notification.Builder(context, channelId)
        } else {
            @Suppress("DEPRECATION")
            Notification.Builder(context)
        }
        val notif = builder
            .setContentTitle(title)
            .setContentText(body)
            .setStyle(Notification.BigTextStyle().bigText(body))
            .setSmallIcon(context.applicationInfo.icon)
            .setAutoCancel(true)
            .build()
        nm.notify(8842, notif)
    }
}
"""
open(os.path.join(kt_dir, "BmStreakReceiver.kt"), "w", encoding="utf-8").write(recv_kt)
PY_NATIVE
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          fi

          if [ -f android/build.gradle.kts ]; then
            cat << 'KTS_EOF' >> android/build.gradle.kts
            subprojects {
                tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach { enabled = false }
            }
          KTS_EOF
          elif [ -f android/build.gradle ]; then
            cat << 'GROOVY_EOF' >> android/build.gradle
            subprojects {
                tasks.configureEach { task -> if (task.name.toLowerCase().contains("lintvital")) task.enabled = false }
            }
          GROOVY_EOF
          fi

      - name: Inject Android 13+ POST_NOTIFICATIONS Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application/' "$MANIFEST"
          fi
      - name: Inject CafeBazaar Billing Permission & Queries
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "PAY_THROUGH_BAZAAR" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="com.farsitel.bazaar.permission.PAY_THROUGH_BAZAAR"/>\n    <queries><package android:name="com.farsitel.bazaar"/></queries>\n    <application|' "$MANIFEST"
          fi

      - name: Configure CafeBazaar Native In-App Billing (Poolakey)
        run: |
          if ! grep -q "flutter_poolakey:" pubspec.yaml; then
            sed -i '/url_launcher:/a\  flutter_poolakey: ^2.2.0+1.0.0' pubspec.yaml
          fi
          cat << 'BAZAAR_BILLING_EOF' > lib/store_billing.dart
          import 'dart:async';
          import 'package:flutter_poolakey/flutter_poolakey.dart';
          import 'package:url_launcher/url_launcher.dart';

          class BmStoreBilling {
            static const String storeFlavor = 'bazaar';
            static const String rsaKey = String.fromEnvironment('STORE_RSA_KEY', defaultValue: '');
            static String lastError = '';
            static bool _connected = false;

            static Future purchase({
              required String sku,
              String payload = '',
              bool consumeImmediately = true,
            }) async {
              lastError = '';
              final cleanKey = rsaKey.replaceAll(RegExp(r'\s+'), '');
              if (cleanKey.isEmpty) {
                lastError = 'کلید RSA کافه‌بازار در بیلد خالی است (BAZAR_RSA_KEY)!';
                return null;
              }
              try {
                if (!_connected) {
                  final completer = Completer();
                  await FlutterPoolakey.connect(
                    cleanKey,
                    onSucceed: () {
                      _connected = true;
                      if (!completer.isCompleted) completer.complete(true);
                    },
                    onFailed: () {
                      _connected = false;
                      if (!completer.isCompleted) completer.complete(false);
                    },
                    onDisconnected: () {
                      _connected = false;
                    },
                  );
                  final ok = await completer.future.timeout(
                    const Duration(seconds: 10),
                    onTimeout: () => false,
                  );
                  if (ok != true) {
                    lastError = 'اتصال به اپلیکیشن کافه‌بازار برقرار نشد! مطمئن شو کافه‌بازار روی گوشیت نصب و به‌روزه و توش وارد شدی 🟢';
                    return null;
                  }
                }

                final purchaseInfo = await FlutterPoolakey.purchase(
                  sku,
                  payload: payload,
                );
                final token = purchaseInfo.purchaseToken;
                if (token.isNotEmpty) {
                  if (consumeImmediately) {
                    try {
                      await FlutterPoolakey.consume(token);
                    } catch (_) {}
                  }
                  return {
                    'purchaseToken': token,
                    'market': 'cafebazaar',
                    'sku': sku,
                  };
                }
                lastError = 'پرداخت توسط کاربر لغو شد یا توکن از بازار دریافت نشد.';
              } catch (e) {
                _connected = false;
                lastError = 'خطای درگاه کافه‌بازار: $e';
              }
              return null;
            }

            static Future<void> openStoreUpdate() async {
              final uri = Uri.parse('bazaar://details?id=ir.matinmohammadi.bodymod');
              try {
                final ok = await launchUrl(uri, mode: LaunchMode.externalApplication);
                if (!ok) {
                  await launchUrl(
                    Uri.parse('https://cafebazaar.ir/app/ir.matinmohammadi.bodymod'),
                    mode: LaunchMode.externalApplication,
                  );
                }
              } catch (_) {}
            }
          }
          BAZAAR_BILLING_EOF

      - name: Build CafeBazaar Release APK (32/64-bit)
        env:
          STORE_RSA_KEY: ${{ secrets.BAZAR_RSA_KEY }}
        run: |
          flutter pub get
          python3 - << 'POOLAKEY_FIX_EOF'
          import glob, os, re

          # 1. Add jitpack.io to android/build.gradle(.kts)
          for gfile in ["android/build.gradle.kts", "android/build.gradle"]:
              if os.path.exists(gfile):
                  with open(gfile, "r", encoding="utf-8") as f:
                      g = f.read()
                  if "jitpack.io" not in g:
                      if gfile.endswith(".kts"):
                          g = g.replace("mavenCentral()", 'mavenCentral()\n        maven { url = uri("https://jitpack.io") }')
                      else:
                          g = g.replace("mavenCentral()", 'mavenCentral()\n        maven { url "https://jitpack.io" }')
                      with open(gfile, "w", encoding="utf-8") as f:
                          f.write(g)

          # 2. Patch flutter_poolakey plugin build.gradle (add namespace & compileSdk) and AndroidManifest.xml
          pub_cache = os.environ.get("PUB_CACHE", os.path.expanduser("~/.pub-cache"))
          for pdir in glob.glob(os.path.join(pub_cache, "hosted", "*", "flutter_poolakey-*")):
              pgradle = os.path.join(pdir, "android", "build.gradle")
              if os.path.exists(pgradle):
                  with open(pgradle, "r", encoding="utf-8") as f:
                      pg = f.read()
                  if "namespace" not in pg:
                      pg = pg.replace("android {", 'android {\n    namespace "ir.cafebazaar.flutter_poolakey"', 1)
                  pg = re.sub(r"jcenter\s*\(\s*\)", "mavenCentral()", pg)
                  pg = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 34", pg)
                  with open(pgradle, "w", encoding="utf-8") as f:
                      f.write(pg)
                  print("Patched Poolakey Gradle:", pgradle)
              pmanifest = os.path.join(pdir, "android", "src", "main", "AndroidManifest.xml")
              if os.path.exists(pmanifest):
                  with open(pmanifest, "r", encoding="utf-8") as f:
                      pm = f.read()
                  pm_new = re.sub(r'\s+package="[^"]+"', "", pm)
                  if pm_new != pm:
                      with open(pmanifest, "w", encoding="utf-8") as f:
                          f.write(pm_new)
                      print("Patched Poolakey Manifest:", pmanifest)
          POOLAKEY_FIX_EOF
          BUILD_NUM=$((300 + ${{ github.run_number }} * 2))
          flutter build apk --release --no-shrink \
            --target-platform android-arm,android-arm64 \
            --dart-define=STORE_FLAVOR=bazaar \
            --dart-define=STORE_RSA_KEY="$STORE_RSA_KEY" \
            --build-name=8.1.${{ github.run_number }} \
            --build-number=$BUILD_NUM
          cp build/app/outputs/flutter-apk/app-release.apk BodyMod-v8.1.${{ github.run_number }}-CafeBazaar.apk

      - name: Strictly Sign CafeBazaar APK ONLY with Secret Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ خطا: سکرت RELEASE_KEYSTORE_BASE64 خالی است!"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > bodymod.keystore
          if ! keytool -list -v -keystore bodymod.keystore -alias bodymod_master_key -storepass Matin1383 | grep -E "SHA1:|SHA256:"; then
            echo "❌ خطا: کلید داخل سکرت معتبر نیست! بیلد متوقف شد."
            rm -f bodymod.keystore
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks bodymod.keystore --ks-key-alias bodymod_master_key --ks-pass pass:Matin1383 --key-pass pass:Matin1383 "BodyMod-v8.1.${{ github.run_number }}-CafeBazaar.apk"
          "$APKSIGNER" verify --print-certs "BodyMod-v8.1.${{ github.run_number }}-CafeBazaar.apk" | grep -E "SHA-1|SHA-256"
          rm -f bodymod.keystore

      - name: Upload CafeBazaar APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-CafeBazaar-APK
          path: BodyMod-v8.1.${{ github.run_number }}-CafeBazaar.apk

      - name: Publish CafeBazaar Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v8.1.${{ github.run_number }}-bazaar
          name: "🟢 BodyMod v8.1.${{ github.run_number }} (نسخه رسمی کافه‌بازار)"
          files: BodyMod-v8.1.${{ github.run_number }}-CafeBazaar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
