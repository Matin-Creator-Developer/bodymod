name: Build Native Flutter BodyMod APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create Official Flutter Skeleton (Preserving index.html)
        run: |
          cp -r lib /tmp/bm_lib
          cp pubspec.yaml /tmp/bm_pubspec.yaml
          if [ -f index.html ]; then cp index.html /tmp/bm_index.html; fi

          rm -rf android ios web build www platforms plugins app.html config.xml package.json

          flutter create --org ir.matinmohammadi --project-name bodymod --platforms=android .

          rm -rf lib
          cp -r /tmp/bm_lib lib
          cp /tmp/bm_pubspec.yaml pubspec.yaml
          if [ -f /tmp/bm_index.html ]; then cp /tmp/bm_index.html index.html; fi

          # تنظیم نام برنامه به BodyMod و افزودن مجوز اینترنت
          sed -i 's/android:label="bodymod"/android:label="BodyMod"/g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          fi

          # اطمینان از minSdk = 21 برای سازگاری کامل با google_sign_in
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle
          fi

      - name: Verify Dart Code & Build Universal Release APK
        run: |
          flutter pub get

          echo "🔎 Checking Dart code for any compile errors..."
          dart analyze lib/ || true

          BUILD_NUM=$((200 + ${{ github.run_number }}))
          flutter build apk --release --no-shrink --target-platform android-arm,android-arm64 --build-name=8.0.${{ github.run_number }} --build-number=$BUILD_NUM

      - name: Sign APK with Permanent Master Keystore (apksigner)
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > bodymod.keystore
          fi

          if [ ! -s bodymod.keystore ]; then
            rm -f bodymod.keystore
            keytool -genkey -v -keystore bodymod.keystore \
              -alias bodymod_master_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Matin1383 -keypass Matin1383 \
              -dname "CN=Matin Mohammadi, OU=BodyMod, O=MatinTech, L=Urmia, S=WA, C=IR"
          fi

          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)

          "$APKSIGNER" sign --ks bodymod.keystore \
            --ks-key-alias bodymod_master_key \
            --ks-pass pass:Matin1383 \
            --key-pass pass:Matin1383 \
            "$APK_PATH"

          "$APKSIGNER" verify -v "$APK_PATH"
          rm -f bodymod.keystore

      - name: Upload Signed BodyMod APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-v8-Native-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v8.0.${{ github.run_number }}
          name: "BodyMod v8.0.${{ github.run_number }} (100% Native Flutter)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
