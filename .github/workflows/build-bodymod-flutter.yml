name: Build Native Flutter BodyMod APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean Legacy Web/Cordova Files & Create Official Flutter Skeleton
        run: |
          # پشتیبان‌گیری از کدهای دارت و pubspec
          cp -r lib /tmp/bm_lib
          cp pubspec.yaml /tmp/bm_pubspec.yaml

          # پاکسازی فایل‌های اضافی کوردوا از سرور بیلد (بدون دست زدن به index.html)
          rm -rf android ios web build www platforms plugins app.html config.xml package.json

          # ساخت اسکلت استاندارد و کارخانه‌ای اندروید توسط فلاتر
          flutter create --org ir.matinmohammadi --project-name bodymod --platforms=android .

          # بازگرداندن کدهای ۴ پارت دارت ما
          rm -rf lib
          cp -r /tmp/bm_lib lib
          cp /tmp/bm_pubspec.yaml pubspec.yaml

          # تنظیم نام برنامه به BodyMod و افزودن مجوز اینترنت
          sed -i 's/android:label="bodymod"/android:label="BodyMod"/g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          fi

      - name: Inject Permanent Master Keystore from GitHub Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > android/app/bodymod.keystore
          else
            keytool -genkey -v -keystore android/app/bodymod.keystore \
              -alias bodymod_master_key -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass Matin1383 -keypass Matin1383 \
              -dname "CN=Matin Mohammadi, OU=BodyMod, O=MatinTech, L=Urmia, S=WA, C=IR"
          fi

          cat << 'SIGN_SCRIPT' > patch_gradle.py
          import pathlib

          gradle_kts = pathlib.Path("android/app/build.gradle.kts")
          gradle_groovy = pathlib.Path("android/app/build.gradle")

          if gradle_kts.exists():
              txt = gradle_kts.read_text()
              signing_block = '''
              signingConfigs {
                  create("release") {
                      storeFile = file("bodymod.keystore")
                      storePassword = "Matin1383"
                      keyAlias = "bodymod_master_key"
                      keyPassword = "Matin1383"
                  }
              }
              '''
              txt = txt.replace('buildTypes {', signing_block + '\n    buildTypes {')
              txt = txt.replace('signingConfig = signingConfigs.getByName("debug")', 'signingConfig = signingConfigs.getByName("release")')
              gradle_kts.write_text(txt)
          elif gradle_groovy.exists():
              txt = gradle_groovy.read_text()
              signing_block = '''
              signingConfigs {
                  release {
                      storeFile file("bodymod.keystore")
                      storePassword "Matin1383"
                      keyAlias "bodymod_master_key"
                      keyPassword "Matin1383"
                  }
              }
              '''
              txt = txt.replace('buildTypes {', signing_block + '\n    buildTypes {')
              txt = txt.replace('signingConfig signingConfigs.debug', 'signingConfig signingConfigs.release')
              txt = txt.replace('signingConfig = signingConfigs.debug', 'signingConfig = signingConfigs.release')
              gradle_groovy.write_text(txt)
          SIGN_SCRIPT
          python3 patch_gradle.py
          rm -f patch_gradle.py

      - name: Build Universal Signed Native Flutter APK (32-bit & 64-bit)
        run: |
          flutter pub get
          BUILD_NUM=$((200 + ${{ github.run_number }}))
          flutter build apk --release --target-platform android-arm,android-arm64 --build-name=8.0.${{ github.run_number }} --build-number=$BUILD_NUM

      - name: Upload Signed BodyMod APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-v8-Native-Flutter-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Automatic Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v8.0.${{ github.run_number }}
          name: "BodyMod v8.0.${{ github.run_number }} (100% Native Flutter)"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
