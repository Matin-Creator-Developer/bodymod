name: "🔵 Build BodyMod - Myket Edition"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_myket:
    name: "Compile & Sign Myket APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Skeleton & Custom Icon (Myket)
        run: |
          cp -r lib /tmp/bm_lib
          cp pubspec.yaml /tmp/bm_pubspec.yaml
          if [ -f icon.png ]; then cp icon.png /tmp/bm_icon.png; fi

          rm -rf android ios web build www platforms plugins app.html config.xml package.json
          flutter create --org ir.matinmohammadi --project-name bodymod --platforms=android .

          rm -rf lib
          cp -r /tmp/bm_lib lib
          cp /tmp/bm_pubspec.yaml pubspec.yaml
          mkdir -p assets
          if [ -f /tmp/bm_icon.png ]; then
            cp /tmp/bm_icon.png icon.png
            cp /tmp/bm_icon.png assets/icon.png
          fi

          pip install Pillow
          python3 - << 'ICON_EOF'
          import os, shutil
          from PIL import Image
          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              res_dir = "android/app/src/main/res"
              shutil.rmtree(os.path.join(res_dir, "mipmap-anydpi-v26"), ignore_errors=True)
              for folder, px in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}.items():
                  p = os.path.join(res_dir, folder)
                  os.makedirs(p, exist_ok=True)
                  img.resize((px, px), Image.Resampling.LANCZOS).save(os.path.join(p, "ic_launcher.png"), format="PNG")
          ICON_EOF

          sed -i 's/android:label="bodymod"/android:label="BodyMod"/g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          fi

          if [ -f android/build.gradle.kts ]; then
            cat << 'KTS_EOF' >> android/build.gradle.kts
            subprojects {
                tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach { enabled = false }
            }
          KTS_EOF
          elif [ -f android/build.gradle ]; then
            cat << 'GROOVY_EOF' >> android/build.gradle
            subprojects {
                tasks.configureEach { task -> if (task.name.toLowerCase().contains("lintvital")) task.enabled = false }
            }
          GROOVY_EOF
          fi

      - name: Build Myket Release APK (32/64-bit)
        run: |
          flutter pub get
          BUILD_NUM=$((301 + ${{ github.run_number }} * 2))
          if [ -f android/app/build.gradle.kts ]; then sed -i 's/compileSdk = .*/compileSdk = 37/g' android/app/build.gradle.kts; sed -i 's/compileSdk=.*/compileSdk = 37/g' android/app/build.gradle.kts; fi; if [ -f android/app/build.gradle ]; then sed -i 's/compileSdkVersion .*/compileSdkVersion 37/g' android/app/build.gradle; sed -i 's/compileSdk .*/compileSdk 37/g' android/app/build.gradle; fi
          if [ -f android/app/src/main/AndroidManifest.xml ] && ! grep -q 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml; then sed -i 's/<manifest[^>]*>/&\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <uses-permission android:name="android.permission.INTERNET"\/>/' android/app/src/main/AndroidManifest.xml; fi; KT_FILE=$(find android/app/src/main/kotlin android/app/src/main/java -name 'MainActivity.kt' 2>/dev/null | head -n 1); if [ -n "$KT_FILE" ] && ! grep -q 'ir.matinmohammadi.bodymod/notifications' "$KT_FILE"; then PKG_LINE=$(grep '^package ' "$KT_FILE" | head -n 1); printf '%s\nimport android.app.NotificationChannel\nimport android.app.NotificationManager\nimport android.content.Context\nimport android.os.Build\nimport androidx.core.app.NotificationCompat\nimport io.flutter.embedding.android.FlutterActivity\nimport io.flutter.embedding.engine.FlutterEngine\nimport io.flutter.plugin.common.MethodChannel\n\nclass MainActivity: FlutterActivity() {\n    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {\n        super.configureFlutterEngine(flutterEngine)\n        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "ir.matinmohammadi.bodymod/notifications").setMethodCallHandler { call, result ->\n            if (call.method == "showImmediateNotification") {\n                val title = call.argument<String>("title") ?: "بادی‌مود"\n                val body = call.argument<String>("body") ?: "سیستم اطلاع‌رسانی بادی‌مود فعال شد!"\n                val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager\n                val cid = "bodymod_alerts"\n                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {\n                    nm.createNotificationChannel(NotificationChannel(cid, "اعلان‌های بادی‌مود", NotificationManager.IMPORTANCE_HIGH))\n                }\n                val n = NotificationCompat.Builder(this, cid).setSmallIcon(android.R.drawable.ic_dialog_info).setContentTitle(title).setContentText(body).setPriority(NotificationCompat.PRIORITY_HIGH).setAutoCancel(true).build()\n                nm.notify(1001, n)\n                result.success(true)\n            } else { result.notImplemented() }\n        }\n    }\n}\n' "$PKG_LINE" > "$KT_FILE"; fi
          flutter build apk --release --no-shrink \
            --target-platform android-arm,android-arm64 \
            --dart-define=STORE_FLAVOR=myket \
            --build-name=8.1.${{ github.run_number }} \
            --build-number=$BUILD_NUM
          cp build/app/outputs/flutter-apk/app-release.apk BodyMod-v8.1.${{ github.run_number }}-Myket.apk

      - name: Strictly Sign Myket APK ONLY with Secret Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ خطا: سکرت RELEASE_KEYSTORE_BASE64 خالی است!"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > bodymod.keystore
          if ! keytool -list -v -keystore bodymod.keystore -alias bodymod_master_key -storepass Matin1383 | grep -E "SHA1:|SHA256:"; then
            echo "❌ خطا: کلید داخل سکرت معتبر نیست! بیلد متوقف شد."
            rm -f bodymod.keystore
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks bodymod.keystore --ks-key-alias bodymod_master_key --ks-pass pass:Matin1383 --key-pass pass:Matin1383 "BodyMod-v8.1.${{ github.run_number }}-Myket.apk"
          "$APKSIGNER" verify --print-certs "BodyMod-v8.1.${{ github.run_number }}-Myket.apk" | grep -E "SHA-1|SHA-256"
          rm -f bodymod.keystore

      - name: Upload Myket APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-Myket-APK
          path: BodyMod-v8.1.${{ github.run_number }}-Myket.apk

      - name: Publish Myket Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v8.1.${{ github.run_number }}-myket
          name: "🔵 BodyMod v8.1.${{ github.run_number }} (نسخه رسمی مایکت)"
          files: BodyMod-v8.1.${{ github.run_number }}-Myket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
