name: "🔵 Build BodyMod - Myket Edition"

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_myket:
    name: "Compile & Sign Myket APK"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Flutter Skeleton & Custom Icon (Myket)
        run: |
          cp -r lib /tmp/bm_lib
          cp pubspec.yaml /tmp/bm_pubspec.yaml
          if [ -f icon.png ]; then cp icon.png /tmp/bm_icon.png; fi

          rm -rf android ios web build www platforms plugins app.html config.xml package.json
          flutter create --org ir.matinmohammadi --project-name bodymod --platforms=android .

          rm -rf lib
          cp -r /tmp/bm_lib lib
          cp /tmp/bm_pubspec.yaml pubspec.yaml
          mkdir -p assets
          if [ -f /tmp/bm_icon.png ]; then
            cp /tmp/bm_icon.png icon.png
            cp /tmp/bm_icon.png assets/icon.png
          fi

          pip install Pillow
          python3 - << 'ICON_EOF'
          import os, shutil
          from PIL import Image
          if os.path.exists("icon.png"):
              img = Image.open("icon.png").convert("RGBA")
              res_dir = "android/app/src/main/res"
              shutil.rmtree(os.path.join(res_dir, "mipmap-anydpi-v26"), ignore_errors=True)
              for folder, px in {"mipmap-mdpi":48, "mipmap-hdpi":72, "mipmap-xhdpi":96, "mipmap-xxhdpi":144, "mipmap-xxxhdpi":192}.items():
                  p = os.path.join(res_dir, folder)
                  os.makedirs(p, exist_ok=True)
                  img.resize((px, px), Image.Resampling.LANCZOS).save(os.path.join(p, "ic_launcher.png"), format="PNG")
          ICON_EOF

          sed -i 's/android:label="bodymod"/android:label="BodyMod"/g' android/app/src/main/AndroidManifest.xml
          if ! grep -q "android.permission.INTERNET" android/app/src/main/AndroidManifest.xml; then
            sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          fi

          if [ -f android/build.gradle.kts ]; then
            cat << 'KTS_EOF' >> android/build.gradle.kts
            subprojects {
                tasks.matching { it.name.contains("lintVital", ignoreCase = true) }.configureEach { enabled = false }
            }
          KTS_EOF
          elif [ -f android/build.gradle ]; then
            cat << 'GROOVY_EOF' >> android/build.gradle
            subprojects {
                tasks.configureEach { task -> if (task.name.toLowerCase().contains("lintvital")) task.enabled = false }
            }
          GROOVY_EOF
          fi

      - name: Inject Android 13+ POST_NOTIFICATIONS Permission
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "POST_NOTIFICATIONS" "$MANIFEST"; then
            sed -i 's/<application/<uses-permission android:name="android.permission.POST_NOTIFICATIONS"\/>\n    <application/' "$MANIFEST"
          fi
      - name: Inject Myket Billing Permission & Queries
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "ir.mservices.market.BILLING" "$MANIFEST"; then
            sed -i 's|<application|<uses-permission android:name="ir.mservices.market.BILLING"/>\n    <queries><package android:name="ir.mservices.market"/></queries>\n    <application|' "$MANIFEST"
          fi

      - name: Configure Myket Native In-App Billing (myket_iap)
        run: |
          if ! grep -q "myket_iap:" pubspec.yaml; then
            sed -i '/url_launcher:/a\  myket_iap: ^2.0.1' pubspec.yaml
          fi
          python3 - << 'MYKET_GRADLE_EOF'
          import os
          if os.path.exists("android/build.gradle.kts"):
              with open("android/build.gradle.kts", "r", encoding="utf-8") as f:
                  s = f.read()
              if "maven.myket.ir" not in s:
                  s = s.replace("mavenCentral()", 'mavenCentral()\n        maven { url = uri("https://maven.myket.ir") }')
                  with open("android/build.gradle.kts", "w", encoding="utf-8") as f:
                      f.write(s)
          elif os.path.exists("android/build.gradle"):
              with open("android/build.gradle", "r", encoding="utf-8") as f:
                  s = f.read()
              if "maven.myket.ir" not in s:
                  s = s.replace("mavenCentral()", 'mavenCentral()\n        maven { url "https://maven.myket.ir" }')
                  with open("android/build.gradle", "w", encoding="utf-8") as f:
                      f.write(s)

          if os.path.exists("android/app/build.gradle.kts"):
              with open("android/app/build.gradle.kts", "r", encoding="utf-8") as f:
                  s = f.read()
              if "marketApplicationId" not in s:
                  ph = '''        manifestPlaceholders["marketApplicationId"] = "ir.mservices.market"
                  manifestPlaceholders["marketBindAddress"] = "ir.mservices.market.InAppBillingService.BIND"
                  manifestPlaceholders["marketPermission"] = "ir.mservices.market.BILLING"
          '''
                  s = s.replace("defaultConfig {", "defaultConfig {\n" + ph, 1)
                  with open("android/app/build.gradle.kts", "w", encoding="utf-8") as f:
                      f.write(s)
          elif os.path.exists("android/app/build.gradle"):
              with open("android/app/build.gradle", "r", encoding="utf-8") as f:
                  s = f.read()
              if "marketApplicationId" not in s:
                  ph = '''        manifestPlaceholders += [
                      marketApplicationId: "ir.mservices.market",
                      marketBindAddress: "ir.mservices.market.InAppBillingService.BIND",
                      marketPermission: "ir.mservices.market.BILLING"
                  ]
          '''
                  s = s.replace("defaultConfig {", "defaultConfig {\n" + ph, 1)
                  with open("android/app/build.gradle", "w", encoding="utf-8") as f:
                      f.write(s)
          MYKET_GRADLE_EOF
          cat << 'MYKET_BILLING_EOF' > lib/store_billing.dart
          import 'package:myket_iap/myket_iap.dart';
          import 'package:myket_iap/util/iab_result.dart';
          import 'package:myket_iap/util/purchase.dart';
          import 'package:url_launcher/url_launcher.dart';

          class BmStoreBilling {
            static const String storeFlavor = 'myket';
            static const String rsaKey = String.fromEnvironment('STORE_RSA_KEY', defaultValue: '');
            static String lastError = '';

            static Future purchase({
              required String sku,
              String payload = '',
              bool consumeImmediately = true,
            }) async {
              if (rsaKey.replaceAll(RegExp(r'\s+'), '').isEmpty) return null;
              try {
                final IabResult? initRes = await MyketIAP.init(
                  rsaKey: rsaKey.replaceAll(RegExp(r'\s+'), ''),
                  enableDebugLogging: false,
                );
                if (initRes == null || !initRes.isSuccess()) return null;

                final Map resultMap = await MyketIAP.launchPurchaseFlow(
                  sku: sku,
                  payload: payload,
                );
                final IabResult? res = resultMap[MyketIAP.RESULT] as IabResult?;
                final Purchase? purchase = resultMap[MyketIAP.PURCHASE] as Purchase?;

                if (res != null && res.isSuccess() && purchase != null) {
                  final token = purchase.mToken;
                  if (consumeImmediately) {
                    try {
                      await MyketIAP.consume(purchase: purchase);
                    } catch (_) {}
                  }
                  try {
                    await MyketIAP.dispose();
                  } catch (_) {}
                  return {
                    'purchaseToken': token,
                    'market': 'myket',
                    'sku': sku,
                  };
                }
                try {
                  await MyketIAP.dispose();
                } catch (_) {}
              } catch (_) {}
              return null;
            }

            static Future<void> openStoreUpdate() async {
              final uri = Uri.parse('myket://details?id=ir.matinmohammadi.bodymod');
              try {
                final ok = await launchUrl(uri, mode: LaunchMode.externalApplication);
                if (!ok) {
                  await launchUrl(
                    Uri.parse('https://myket.ir/app/ir.matinmohammadi.bodymod'),
                    mode: LaunchMode.externalApplication,
                  );
                }
              } catch (_) {}
            }
          }
          MYKET_BILLING_EOF

      - name: Build Myket Release APK (32/64-bit)
        env:
          STORE_RSA_KEY: ${{ secrets.MYKET_RSA_KEY }}
        run: |
          flutter pub get
          BUILD_NUM=$((301 + ${{ github.run_number }} * 2))
          flutter build apk --release --no-shrink \
            --target-platform android-arm,android-arm64 \
            --dart-define=STORE_FLAVOR=myket \
            --dart-define=STORE_RSA_KEY="$STORE_RSA_KEY" \
            --build-name=8.1.${{ github.run_number }} \
            --build-number=$BUILD_NUM
          cp build/app/outputs/flutter-apk/app-release.apk BodyMod-v8.1.${{ github.run_number }}-Myket.apk

      - name: Strictly Sign Myket APK ONLY with Secret Keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "❌ خطا: سکرت RELEASE_KEYSTORE_BASE64 خالی است!"
            exit 1
          fi
          echo "$KEYSTORE_B64" | tr -d ' \n\r\t' | base64 --decode > bodymod.keystore
          if ! keytool -list -v -keystore bodymod.keystore -alias bodymod_master_key -storepass Matin1383 | grep -E "SHA1:|SHA256:"; then
            echo "❌ خطا: کلید داخل سکرت معتبر نیست! بیلد متوقف شد."
            rm -f bodymod.keystore
            exit 1
          fi
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          "$APKSIGNER" sign --ks bodymod.keystore --ks-key-alias bodymod_master_key --ks-pass pass:Matin1383 --key-pass pass:Matin1383 "BodyMod-v8.1.${{ github.run_number }}-Myket.apk"
          "$APKSIGNER" verify --print-certs "BodyMod-v8.1.${{ github.run_number }}-Myket.apk" | grep -E "SHA-1|SHA-256"
          rm -f bodymod.keystore

      - name: Upload Myket APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-Myket-APK
          path: BodyMod-v8.1.${{ github.run_number }}-Myket.apk

      - name: Publish Myket Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v8.1.${{ github.run_number }}-myket
          name: "🔵 BodyMod v8.1.${{ github.run_number }} (نسخه رسمی مایکت)"
          files: BodyMod-v8.1.${{ github.run_number }}-Myket.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
