name: Build BodyMod Official Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 دریافت کدهای پروژه
        uses: actions/checkout@v4

      - name: ☕ نصب جاوا (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ آماده‌سازی Android SDK
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 🟢 نصب Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 ساخت APK با مدیریت اختیاری نوتیفیکیشن و مرورگر پیش‌فرض
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          npm install -g cordova
          cordova create bodymod_native ir.matinmohammadi.bodymod "BodyMod"
          cd bodymod_native

          rm -rf www/*
          cp ../app.html www/index.html
          [ -f "../earth_burn.mp4" ] && cp ../earth_burn.mp4 www/earth_burn.mp4
          [ -f "../icon.png" ] && cp ../icon.png ./icon.png && cp ../icon.png www/icon.png

          sed -i "s|window.open(\`\${WORKER_BASE_URL}/auth/google-direct\`, '_system');|if(window.AndroidNative \&\& window.AndroidNative.openExternal){window.AndroidNative.openExternal(\`\${WORKER_BASE_URL}/auth/google-direct\`);}else{window.location.href=\`\${WORKER_BASE_URL}/auth/google-direct\`;}|g" www/index.html

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="ir.matinmohammadi.bodymod" version="7.7.1" android-versionCode="771" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>BodyMod</name>
              <description>سوپراپلیکیشن هوشمند بادی‌مود</description>
              <author email="diaperloveradultbaby5@gmail.com" href="https://bodymod.matin-mohammadi.ir">Matin Mohammadi</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-intent href="bodymod://*/*" />
              <allow-navigation href="https://localhost/*" />
              <allow-navigation href="http://localhost/*" />
              <preference name="AndroidLaunchMode" value="singleTask" />
              <preference name="Scheme" value="https" />
              <preference name="Hostname" value="localhost" />
              <preference name="MixedContentMode" value="0" />
              <preference name="MediaPlaybackRequiresUserAction" value="false" />
              <preference name="DisallowOverscroll" value="true" />
              <icon src="icon.png" />
              <platform name="android">
                  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                      <application android:usesCleartextTraffic="true" />
                  </edit-config>
                  <config-file target="AndroidManifest.xml" parent="/manifest">
                      <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
                      <uses-permission android:name="android.permission.VIBRATE" />
                  </config-file>
                  <config-file target="AndroidManifest.xml" parent="/manifest/application/activity[@android:name='MainActivity']">
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="bodymod" android:host="auth" />
                      </intent-filter>
                  </config-file>
              </platform>
          </widget>
          EOF

          cordova platform add android@13.0.0

          # تزریق جاوا: پل اختیاری نوتیفیکیشن و مرورگر
          MAIN_ACT="platforms/android/app/src/main/java/ir/matinmohammadi/bodymod/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package ir.matinmohammadi.bodymod;
          import android.os.Bundle;
          import android.os.Build;
          import android.content.Intent;
          import android.content.Context;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebView;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Notification;
          import android.app.PendingIntent;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import org.apache.cordova.*;

          public class MainActivity extends CordovaActivity {
              private static final String CHANNEL_ID = "bodymod_optional_channel";

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);
                  createNotificationChannel();

                  if (appView != null && appView.getView() instanceof WebView) {
                      WebView wv = (WebView) appView.getView();
                      wv.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void openExternal(String url) {
                              try {
                                  Intent browserIntent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                                  browserIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                                  startActivity(browserIntent);
                              } catch (Exception ignored) {}
                          }

                          @JavascriptInterface
                          public void requestNotificationPermission(final String title, final String message) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      if (Build.VERSION.SDK_INT >= 33) {
                                          if (ContextCompat.checkSelfPermission(MainActivity.this, "android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                                              ActivityCompat.requestPermissions(MainActivity.this, new String[]{"android.permission.POST_NOTIFICATIONS"}, 102);
                                              return;
                                          }
                                      }
                                      showNativeNotification(title, message);
                                  }
                              });
                          }

                          @JavascriptInterface
                          public void sendLocalNotification(final String title, final String message) {
                              runOnUiThread(new Runnable() {
                                  @Override
                                  public void run() {
                                      showNativeNotification(title, message);
                                  }
                              });
                          }
                      }, "AndroidNative");
                  }

                  handleGoogleDeepLink(getIntent());
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      NotificationChannel channel = new NotificationChannel(
                          CHANNEL_ID,
                          "اعلان‌های اختیاری BodyMod",
                          NotificationManager.IMPORTANCE_DEFAULT
                      );
                      NotificationManager manager = getSystemService(NotificationManager.class);
                      if (manager != null) manager.createNotificationChannel(channel);
                  }
              }

              private void showNativeNotification(String title, String message) {
                  try {
                      NotificationManager manager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                      if (manager == null) return;
                      Intent intent = new Intent(this, MainActivity.class);
                      PendingIntent pendingIntent = PendingIntent.getActivity(this, 0, intent, PendingIntent.FLAG_IMMUTABLE);

                      Notification.Builder builder;
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                          builder = new Notification.Builder(this, CHANNEL_ID);
                      } else {
                          builder = new Notification.Builder(this);
                      }
                      builder.setContentTitle(title)
                             .setContentText(message)
                             .setSmallIcon(getApplicationInfo().icon)
                             .setAutoCancel(true)
                             .setContentIntent(pendingIntent);

                      manager.notify((int) (System.currentTimeMillis() % 100000), builder.build());
                  } catch (Exception ignored) {}
              }

              @Override
              public void onRequestPermissionsResult(int requestCode, String[] permissions, int[] grantResults) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults);
                  if (requestCode == 102 && grantResults.length > 0 && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      showNativeNotification("🔔 یادآورهای انتخابی فعال شدند", "از این پس در صورت تمایل یادآورهای تغذیه و تمرین برایتان ارسال می‌شود.");
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  handleGoogleDeepLink(intent);
              }

              private void handleGoogleDeepLink(Intent intent) {
                  if (intent == null) return;
                  Uri data = intent.getData();
                  if (data != null && "bodymod".equals(data.getScheme())) {
                      final String email = data.getQueryParameter("email") != null ? data.getQueryParameter("email") : "";
                      final String name = data.getQueryParameter("name") != null ? data.getQueryParameter("name") : "";
                      if (!email.isEmpty() && appView != null) {
                          appView.getView().postDelayed(new Runnable() {
                              @Override
                              public void run() {
                                  String js = "if(window.onGoogleChromeAuthSuccess){window.onGoogleChromeAuthSuccess('" + email.replace("'", "") + "','" + name.replace("'", "") + "');}";
                                  appView.loadUrl("javascript:" + js);
                              }
                          }, 600);
                      }
                  }
              }
          }
          EOF

          # جایگزینی کامل آیکون‌ها
          if [ -f "../icon.png" ]; then
            RES_DIR="platforms/android/app/src/main/res"
            rm -rf $RES_DIR/mipmap-anydpi-v26
            rm -rf $RES_DIR/drawable-v24
            find "$RES_DIR" -name "ic_launcher*.xml" -delete
            find "$RES_DIR" -name "ic_launcher*.webp" -delete
            for dir in $RES_DIR/mipmap-*; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/*.png "$dir"/*.webp "$dir"/*.xml
                cp ../icon.png "$dir/ic_launcher.png"
                cp ../icon.png "$dir/ic_launcher_round.png"
                cp ../icon.png "$dir/ic_launcher_foreground.png"
              fi
            done
          fi

          cordova build android --release -- --packageType=apk

      - name: 🔐 امضای دیجیتال APK با کلید ثابت
        run: |
          cd bodymod_native/platforms/android/app/build/outputs/apk/release
          cp ${{ github.workspace }}/bodymod-release.keystore .
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk BodyMod-Aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks bodymod-release.keystore --ks-key-alias bodymod_key --ks-pass pass:MatinBodyMod2026 --key-pass pass:MatinBodyMod2026 --out BodyMod-Official-Market.apk BodyMod-Aligned.apk

      - name: 🎁 آپلود فایل APK
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-Android-Package
          path: bodymod_native/platforms/android/app/build/outputs/apk/release/BodyMod-Official-Market.apk
