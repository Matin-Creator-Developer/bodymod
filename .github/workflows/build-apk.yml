name: Build BodyMod Official Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 دریافت کدهای پروژه از ریپازیتوری
        uses: actions/checkout@v4

      - name: ☕ نصب جاوا (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🛠️ آماده‌سازی Android SDK داخلی گیت‌هاب (پلتفرم ۳۴)
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: 🟢 نصب Node.js و Apache Cordova
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 ساخت پروژه نیتیو اندروید BodyMod
        run: |
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          npm install -g cordova
          cordova create bodymod_native ir.matinmohammadi.bodymod "BodyMod"
          cd bodymod_native

          rm -rf www/*
          if [ -f "../app.html" ]; then
            cp ../app.html www/index.html
          else
            cp ../index.html www/index.html
          fi

          if [ -f "../icon.png" ]; then
            cp ../icon.png ./icon.png
          fi

          cat << 'EOF' > config.xml
          <?xml version='1.0' encoding='utf-8'?>
          <widget id="ir.matinmohammadi.bodymod" version="1.0.3" android-versionCode="4" xmlns="http://www.w3.org/ns/widgets" xmlns:android="http://schemas.android.com/apk/res/android">
              <name>BodyMod</name>
              <description>سوپراپلیکیشن کالری‌شمار و تناسب اندام هوشمند بادی‌مود</description>
              <author email="diaperloveradultbaby5@gmail.com" href="https://bodymod.matin-mohammadi.ir">Matin Mohammadi</author>
              <content src="index.html" />
              <access origin="*" />
              <allow-intent href="http://*/*" />
              <allow-intent href="https://*/*" />
              <allow-navigation href="*" />
              <preference name="Scheme" value="https" />
              <preference name="Hostname" value="localhost" />
              <preference name="MixedContentMode" value="0" />
              <preference name="DisallowOverscroll" value="true" />
              <preference name="AndroidPersistentFileLocation" value="Compatibility" />
              <platform name="android">
                  <edit-config file="app/src/main/AndroidManifest.xml" mode="merge" target="/manifest/application">
                      <application android:usesCleartextTraffic="true" />
                  </edit-config>
              </platform>
          </widget>
          EOF

          cordova platform add android@13.0.0
          cordova build android --release -- --packageType=apk

      - name: 🔐 ساخت کلید امضای دیجیتال رسمی (Keystore) و امضای APK
        run: |
          cd bodymod_native/platforms/android/app/build/outputs/apk/release
          
          keytool -genkey -v -keystore bodymod-release.keystore -alias bodymod_key -keyalg RSA -keysize 2048 -validity 10000 -storepass MatinBodyMod2026 -keypass MatinBodyMod2026 -dname "CN=Matin Mohammadi, OU=BodyMod, O=MatinCreator, L=Urmia, S=WestAzerbaijan, C=IR"
          
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v -p 4 app-release-unsigned.apk BodyMod-v1.0.3-Aligned.apk
          $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks bodymod-release.keystore --ks-key-alias bodymod_key --ks-pass pass:MatinBodyMod2026 --key-pass pass:MatinBodyMod2026 --out BodyMod-Official-Market.apk BodyMod-v1.0.3-Aligned.apk

      - name: 🎁 خروجی گرفتن فایل APK آماده نصب
        uses: actions/upload-artifact@v4
        with:
          name: BodyMod-Android-Package
          path: |
            bodymod_native/platforms/android/app/build/outputs/apk/release/BodyMod-Official-Market.apk
            bodymod_native/platforms/android/app/build/outputs/apk/release/bodymod-release.keystore

